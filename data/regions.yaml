# Historical building-block regions.
#
# Each region is a named group of modern admin units from data/base/units.geojson.
# Polity territories (data/polities/*.yaml) are written as "which regions did this polity
# hold, from which year to which year", and the build dissolves them into polygons.
#
# IMPORTANT: modern admin borders are only a convenient approximation of historical
# extents. A region boundary is never evidence of a historical border.
#
# Selectors (combined as a union, then `exclude` is removed):
#   units:     unit ids, e.g. "IDN:mojokerto", "IDN:kota_mojokerto", "MYS:kedah"
#   provinces: "<country>/<province name>", e.g. "IDN/Bali"
#   countries: ISO3 codes, e.g. "SGP"
#   exclude:   unit ids to drop
#
# Run `npm run data -- --list-units` to print every unit id.

# ───────────────────────────── Java ─────────────────────────────
ej_brantas:
  name: Brantas basin (East Java interior)
  units: [IDN:mojokerto, IDN:kota_mojokerto, IDN:jombang, IDN:kediri, IDN:kota_kediri, IDN:nganjuk,
          IDN:blitar, IDN:kota_blitar, IDN:tulungagung, IDN:trenggalek, IDN:malang, IDN:kota_malang,
          IDN:kota_batu, IDN:sidoarjo, IDN:pasuruan, IDN:kota_pasuruan]
