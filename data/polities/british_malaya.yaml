summary: >
  From the Pangkor Treaty of 1874, Britain placed Residents at the courts of the western Malay states
  to 'advise' their sultans. Perak, Selangor, Negeri Sembilan and Pahang were joined as the Federated
  Malay States in 1895–96. Kedah, Perlis, Kelantan and Terengganu passed from Siamese to British
  overlordship in 1909, and Johor accepted a General Adviser in 1914. These became the Unfederated
  Malay States. Tin and rubber made the region one of the most profitable parts of the British Empire.
