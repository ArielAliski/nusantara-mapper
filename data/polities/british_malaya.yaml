  - { year: 1895, text: "Treaty of Federation creates the Federated Malay States (in force 1896)." }
  - { year: 1909, text: "Anglo-Siamese Treaty: Kedah, Perlis, Kelantan and Terengganu pass to Britain." }
  - { year: 1914, text: "Johor accepts a British General Adviser." }
