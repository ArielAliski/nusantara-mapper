summary: >
  In 1841 the Sultan of Brunei made the English adventurer James Brooke Rajah of Sarawak, then a
  small territory around Kuching. Brooke and his successors expanded north-east at Brunei's expense
  in a series of cessions until 1905, building the state that became modern Sarawak. Britain made it
  a protectorate in 1888. After the Japanese occupation, the last Rajah ceded Sarawak to the British
  Crown in 1946.
