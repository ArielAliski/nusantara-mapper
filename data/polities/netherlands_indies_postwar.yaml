summary: >
  After Japan's surrender, Dutch authorities returned behind British forces and tried to restore
  colonial rule against the Indonesian Republic. They regained the eastern islands and Borneo first,
  where they created federal states such as the State of East Indonesia (1946), and they occupied
  large parts of Java and Sumatra in military offensives in 1947 and 1948. International pressure led
  to the transfer of sovereignty in December 1949, except for western New Guinea.
rulers:
