religions: []
events:
  - { year: 1946, text: "Malino and Denpasar conferences; the State of East Indonesia is created." }
  - { year: 1947, text: "First Dutch military offensive ('police action') in Java and Sumatra." }
  - { year: 1948, text: "Second offensive; Yogyakarta is captured and Republican leaders arrested." }
  - { year: 1949, text: "Round Table Conference; sovereignty is transferred on 27 December." }
