summary: >
  Aceh rose in northern Sumatra in the early 16th century. Under Ali Mughayat Syah it absorbed Pidie
  and Pasai and became a centre of Islamic learning and the pepper trade, rivalling Portuguese
  Malacca. Under Iskandar Muda (1607–1636) it dominated both shores of the Strait of Malacca. It was
  later ruled by four queens in succession (1641–1699). The Netherlands invaded in 1873, beginning one
  of the longest colonial wars. The sultan surrendered in 1903, though resistance continued for years.
