summary: >
  Malaysia was formed on 16 September 1963 by joining the Federation of Malaya (independent since
  1957) with Singapore, Sarawak and North Borneo (Sabah). Indonesia opposed the federation in an armed
  "Confrontation" (1963–1966). Singapore left in August 1965. Malaysia is a federal constitutional
  monarchy whose king is elected in rotation from the hereditary rulers of nine Malay states.
