summary: >
  Western New Guinea was excluded from the 1949 transfer of sovereignty and remained a Dutch colony
  while Indonesia pressed its claim. The Dutch prepared it for self-determination: a New Guinea
  Council was installed in 1961, and the Morning Star flag was first raised. After Indonesian military
  pressure and US mediation, the New York Agreement of 1962 handed the territory to UN administration
  (UNTEA) and then, in May 1963, to Indonesia.
