summary: >
  The Sunda Kingdom ruled western Java for centuries; the name Sunda first appears in the Kebon Kopi
  II inscription of 932. It remained Hindu–Buddhist and independent of Majapahit; the Bubat incident
  of 1357, in which the Sundanese royal party was killed at Majapahit, is remembered in both
  traditions. In 1522 its king signed a treaty with the Portuguese. It lost its ports to Demak-backed
  Banten in 1527, and its capital Pakuan fell to Banten in 1579.
rulers:
  - { name: Niskala Wastu Kancana, from: 1371, to: 1475, approx: true }
  - { name: Sri Baduga Maharaja, from: 1482, to: 1521, approx: true }
religions: [Hinduism, Buddhism, Sundanese traditional religion]
events:
