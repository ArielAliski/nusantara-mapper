  - { year: 1482, approx: true, text: "Sri Baduga Maharaja rules from Pakuan Pajajaran." }
  - { year: 1522, text: "Treaty with the Portuguese; the padrão stone is erected at Sunda Kelapa." }
  - { year: 1579, text: "Pakuan Pajajaran falls to Banten." }
emblem: null
