summary: >
  Kediri (Panjalu) was the western of the two kingdoms created by Airlangga's division of his
  realm. It became the dominant power in East Java in the 12th century, a period known for its Old
  Javanese literature, such as the Kakawin Bharatayuddha of 1157 under King Jayabaya. Chinese
  writers of the time describe Java as a wealthy trading power. Kediri fell in 1222, when Ken Arok of
  Tumapel defeated King Kertajaya.
