summary: >
  After the collapse of Medang, Airlangga, a prince with Balinese roots, was consecrated king in
  1019 and spent the following decades reconquering East Java. His Pucangan (Calcutta Stone)
  inscription recounts these campaigns. Before his death he divided the realm between two heirs,
  creating Janggala and Panjalu (Kediri) around 1045.
