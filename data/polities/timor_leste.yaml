summary: >
  Timor-Leste became independent on 20 May 2002 after more than four centuries of Portuguese
  colonial rule, Indonesian occupation (1975–1999) and UN transitional administration (1999–2002).
  Its population voted overwhelmingly for independence in a UN-run referendum in August 1999.
