id: dutch_east_indies
name: Dutch East Indies
names:
  - { name: Nederlandsch-Indië, lang: Dutch }
  - { name: Netherlands Indies }
type: colony
period:
  start: { year: 1800 }
  end: { year: 1942 }
color: "#e89a3c"
capitals:
  - { name: Batavia, from: 1800, to: 1942, coords: [106.81, -6.13], note: "Buitenzorg (Bogor) was the governor-general's residence." }
summary: >
  When the VOC was dissolved, its possessions passed to the Dutch state. Apart from the British
  interlude in Java (1811–1816), Dutch rule expanded through the 19th century: Java was fully
  subdued after the Java War (1825–1830), and the outer islands were conquered or bound by treaties,
  largely in a last wave of military campaigns between 1873 and about 1910 (Aceh, Bali, Lombok,
  southern Sulawesi, Flores). Japan conquered the colony in March 1942.
rulers:
  - { name: Herman Willem Daendels, from: 1808, to: 1811, note: Governor-general }
  - { name: Johannes van den Bosch, from: 1830, to: 1833, note: Introduced the Cultivation System }
  - { name: J. B. van Heutsz, from: 1904, to: 1909, note: Led the final conquests }
  - { name: A. W. L. Tjarda van Starkenborgh Stachouwer, from: 1936, to: 1942, note: Last pre-war governor-general }
religions: [Islam (majority of population), Christianity, Hinduism (Bali), Buddhism]
events:
  - { year: 1800, text: "The Dutch state takes over the VOC's possessions." }
  - { year: 1825, text: "Java War led by Prince Diponegoro (to 1830)." }
  - { year: 1830, text: "The Cultivation System of forced cash-crop production is introduced on Java." }
  - { year: 1837, text: "Fall of Bonjol ends the main phase of the Padri War in West Sumatra." }
  - { year: 1849, text: "Conquest of north Bali (Buleleng and Jembrana)." }
  - { year: 1860, text: "The Banjarmasin sultanate is abolished during the Banjar War." }
  - { year: 1894, text: "Dutch expedition to Lombok." }
  - { year: 1904, text: "Most of Aceh is under Dutch control after a war begun in 1873." }
  - { year: 1906, text: "Puputan of Badung: the royal court of Badung dies resisting the Dutch (Tabanan falls the same year)." }
  - { year: 1908, text: "Puputan of Klungkung completes the conquest of Bali." }
  - { year: 1942, text: "The Dutch surrender to Japan (8 March)." }
emblem: null
confidence: medium
sources: [ricklefs2008, cribb_kahin2004, reid1969]
unmapped:
  - { from: 1811, to: 1816, note: "British occupation of Java and most Dutch posts (see British Java)." }
predecessors: [voc]
successors: [indonesia, netherlands_indies_postwar]
notes: >
  Dates of 'control' are when Dutch authority was established in the main centres; resistance and
  indirect rule often continued. Many areas were governed through self-governing rulers under Dutch
  suzerainty, shown as zones of influence. Gradual conquests are drawn as estimated growth.
