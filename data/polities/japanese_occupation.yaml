capitals:
  - { name: Singapore (Syonan-to), from: 1942, to: 1945, coords: [103.85, 1.29], note: "Seat of the Southern Army; Java and Sumatra had separate military administrations." }
summary: >
  Between December 1941 and March 1942 Japan conquered British Malaya, Singapore, Borneo, the
  Philippines, Portuguese Timor and the Dutch East Indies. Java, Sumatra and the eastern islands were
  administered separately by the army and navy. The occupation brought forced labour (romusha),
  famine and brutality, but also mobilised nationalist leaders. Japan surrendered in August 1945, two
  days before Indonesia proclaimed independence.
