summary: >
  In 1946 Britain combined the Malay states with Penang and Malacca as the Malayan Union. Malay
  opposition, led by the new UMNO party, forced its replacement by the Federation of Malaya in 1948.
  The communist insurgency known as the Malayan Emergency began the same year. Malaya became
  independent on 31 August 1957 under Tunku Abdul Rahman, and in 1963 it joined Singapore, Sarawak
  and North Borneo to form Malaysia.
