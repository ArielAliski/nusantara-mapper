id: voc
name: Dutch East India Company (VOC)
names:
  - { name: Vereenigde Oostindische Compagnie, lang: Dutch }
type: company_state
period:
  start: { year: 1602 }
  end: { year: 1800 }
color: "#c96a1b"
capitals:
  - { name: Ambon, from: 1610, to: 1619, coords: [128.18, -3.70], note: Seat of the governor-general. }
  - { name: Batavia, from: 1619, to: 1800, coords: [106.81, -6.13] }
summary: >
  The VOC was a chartered Dutch trading company with powers to wage war, sign treaties and govern.
  It seized Ambon in 1605, founded Batavia on the ruins of Jayakarta in 1619, and conquered the Banda
  Islands in 1621 to monopolise nutmeg. It took Malacca from the Portuguese in 1641 and Makassar in
  1667–69, and gained much of Java's coast and the Priangan through interventions in Mataram's wars.
  Debt and corruption led to its dissolution at the end of 1799; its possessions passed to the Dutch
  state.
rulers:
  - { name: Pieter Both, from: 1610, to: 1614, note: First governor-general }
  - { name: Jan Pieterszoon Coen, from: 1619, to: 1623, note: "Again 1627–1629" }
  - { name: Antonio van Diemen, from: 1636, to: 1645 }
  - { name: Rijcklof van Goens, from: 1678, to: 1681 }
religions: [Dutch Reformed Church (company)]
events:
  - { year: 1602, text: "The VOC is chartered in the Dutch Republic." }
  - { year: 1605, text: "The VOC takes Ambon from the Portuguese." }
  - { year: 1619, text: "Coen captures Jayakarta and founds Batavia." }
  - { year: 1621, text: "Conquest of the Banda Islands and destruction of their population." }
  - { year: 1641, text: "The VOC takes Malacca from the Portuguese." }
  - { year: 1667, text: "Treaty of Bongaya after the war with Makassar (Gowa)." }
  - { year: 1740, text: "Massacre of Batavia's Chinese population." }
  - { year: 1768, approx: true, text: "Conquest of Blambangan completed." }
  - { year: 1799, text: "The VOC is dissolved (31 December)." }
emblem: null
confidence: medium
