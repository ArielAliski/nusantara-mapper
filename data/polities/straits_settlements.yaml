summary: >
  The British East India Company acquired Penang in 1786 and founded a trading post at Singapore in
  1819. Malacca was transferred from the Dutch under the Anglo-Dutch Treaty of 1824. The three were
  joined as the Straits Settlements in 1826 and became a Crown colony in 1867. Singapore grew into the
  region's leading port. The colony was dissolved in 1946.
