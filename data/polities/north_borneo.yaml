summary: >
  Northern Borneo, claimed by the sultans of Brunei and Sulu, was leased to Western concession
  holders in 1877–78 and administered by the British North Borneo Chartered Company from 1881; it was
  a British protectorate from 1888. After the Japanese occupation it became a Crown colony in 1946
  (absorbing Labuan), and in 1963 it joined Malaysia as Sabah.
