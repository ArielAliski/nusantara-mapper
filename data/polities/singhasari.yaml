  end: { year: 1292 }
color: "#c26a3d"
capitals:
  - { name: Kutaraja / Singhasari (near Malang), from: 1222, to: 1292, coords: [112.66, -7.89] }
summary: >
  Singhasari was founded by Ken Arok of Tumapel, who defeated Kediri in 1222. Its last king,
  Kertanegara, pursued an ambitious overseas policy. He sent the Pamalayu expedition to Sumatra in
  1275, conquered Bali in 1284, and refused to submit to Kublai Khan. In 1292 he was killed by
  Jayakatwang of Kediri. Kertanegara's son-in-law Raden Wijaya then founded Majapahit, using the
  Mongol army sent to punish Kertanegara.
rulers:
  - { name: Ken Arok (Rajasa), from: 1222, to: 1227 }
  - { name: Anusapati, from: 1227, to: 1248 }
  - { name: Wisnuwardhana, from: 1248, to: 1268 }
  - { name: Kertanegara, from: 1268, to: 1292 }
religions: [Shaivism, Tantric Buddhism]
