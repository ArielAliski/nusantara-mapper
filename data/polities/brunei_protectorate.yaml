summary: >
  The Brunei Sultanate, once dominant on the coasts of Borneo, had lost most of its territory to the
  Brooke Raj of Sarawak and North Borneo by the late 19th century. It became a British protectorate in
  1888 and accepted a British Resident in 1906. Oil, discovered in 1929, transformed its economy.
  Brunei declined to join Malaysia in 1963 and regained full independence in 1984.
