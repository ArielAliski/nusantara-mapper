summary: >
  The Philippines became independent from the United States on 4 July 1946. Only its southern part
  (Mindanao, the Sulu Archipelago and Palawan) falls within the Nusantara region this map focuses on.
  There, the Muslim sultanates of Sulu and Maguindanao long resisted Spanish and later American rule.
  The Bangsamoro Autonomous Region was created in 2019.
