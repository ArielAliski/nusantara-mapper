  Brunei regained full independence from Britain on 1 January 1984. It is an absolute monarchy ruled
  by a sultanate going back to at least the 15th century. The sultanate once controlled much of the
  north Borneo coast but had shrunk to its present two enclaves by 1890. It was a British protectorate
  from 1888.
