summary: >
  During the Napoleonic Wars, British East India Company forces took Java from the Franco-Dutch
  administration in 1811. Under Lieutenant-Governor Thomas Stamford Raffles they sacked the Yogyakarta
  court in 1812, abolished the Banten sultanate and introduced a land-rent system. Java was returned
  to the Netherlands in 1816 under the Anglo-Dutch Convention of 1814.
