notes: >
  1945–1949 is drawn as a low-confidence zone over Java, Madura and Sumatra, the areas recognised in
  the 1946 Linggadjati Agreement. The Republic claimed the whole of the former Dutch East Indies, but
  its real control shifted with the fighting and is not yet drawn year by year.

territory:
