              west_sumatra, riau_mainland, riau_islands, north_sumatra, aceh]
    boundary_type: zone_of_influence
    confidence: low
    note: >
      Areas recognised as under the Republic's de facto authority at Linggadjati (1946). The Dutch
      held major cities and, after the 1947 and 1948 offensives, much more.
  - from: 1949
    to: null
    countries: [IDN]
    except_regions: [west_new_guinea]
    boundary_type: documented
    confidence: high
    note: Transfer of sovereignty, 27 December 1949. Western New Guinea remained under Dutch rule until 1962–63.
  - from: 1963
    to: null
    regions: [west_new_guinea]
    boundary_type: documented
    confidence: high
    note: Transferred from UNTEA on 1 May 1963. The 1969 'Act of Free Choice' remains contested.
  - from: 1976
    to: 1999
