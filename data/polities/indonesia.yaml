    to: 1949
    regions: [ej_brantas, ej_surabaya_gresik, ej_tuban, ej_madiun, ej_lumajang, ej_blambangan, madura,
              cj_demak, cj_lasem, cj_semarang, cj_interior, cj_west, wj_north_coast, wj_bogor,
