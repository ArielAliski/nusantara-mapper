id: indonesia
name: Indonesia
names:
  - { name: Republik Indonesia, lang: Indonesian }
  - { name: Republic of the United States of Indonesia, note: "Federal form, December 1949 – August 1950" }
type: state
period:
  start: { year: 1945 }
  end: null
