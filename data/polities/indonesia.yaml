capitals:
  - { name: Jakarta, from: 1945, to: 1946, coords: [106.83, -6.18] }
  - { name: Yogyakarta, from: 1946, to: 1949, coords: [110.37, -7.80], note: Revolutionary capital }
  - { name: Jakarta, from: 1949, coords: [106.83, -6.18], note: "Law 3/2022 designates Nusantara (East Kalimantan) as the future capital; check the current status of the move." }
summary: >
  Sukarno and Hatta proclaimed Indonesian independence on 17 August 1945, two days after Japan's
  surrender. Four years of revolution and diplomacy followed before the Netherlands transferred
  sovereignty over the former Dutch East Indies, except western New Guinea, on 27 December 1949.
  Western New Guinea passed to Indonesia via a UN administration in 1963. East Timor was occupied from
  1975 to 1999, and that annexation was never recognised by the UN.
rulers:
