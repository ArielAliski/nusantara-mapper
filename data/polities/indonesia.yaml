  - { year: 1946, text: "Linggadjati Agreement: the Netherlands recognises the Republic's de facto authority over Java, Madura and Sumatra." }
  - { year: 1947, text: "First Dutch military offensive (July)." }
  - { year: 1948, text: "Second Dutch military offensive (December); Yogyakarta is captured." }
  - { year: 1949, text: "Transfer of sovereignty (27 December)." }
