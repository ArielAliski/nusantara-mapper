  - { name: Suharto, from: 1967, to: 1998 }
  - { name: B. J. Habibie, from: 1998, to: 1999 }
  - { name: Abdurrahman Wahid, from: 1999, to: 2001 }
  - { name: Megawati Sukarnoputri, from: 2001, to: 2004 }
  - { name: Susilo Bambang Yudhoyono, from: 2004, to: 2014 }
  - { name: Joko Widodo, from: 2014, to: 2024 }
  - { name: Prabowo Subianto, from: 2024 }
religions: [Islam (majority), Protestantism, Catholicism, Hinduism, Buddhism, Confucianism]
events:
