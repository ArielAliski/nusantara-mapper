id: malacca
name: Malacca Sultanate
names:
  - { name: Kesultanan Melayu Melaka, lang: Malay }
  - { name: Melaka }
type: sultanate
period:
  start: { year: 1400, approx: true }
  end: { year: 1511 }
color: "#2e7d4f"
capitals:
