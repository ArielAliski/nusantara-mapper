summary: >
  The Buni complex is an archaeological culture of the north coast of West Java. It is known from
  burial sites in the Bekasi and Karawang area that contain distinctive pottery, beads and metal
  objects. Finds of Indian rouletted ware show trade contacts with South Asia in the early centuries
  AD. It was a culture, not a state: no rulers or political organisation are known.
