summary: >
  Portuguese traders and Dominican missionaries were active on Solor and Timor from the 16th century,
  and a governor was installed at Lifau in 1702. Rivalry with the Dutch at Kupang divided the island.
  The 1859 Treaty of Lisbon and a 1914 arbitral award fixed the border that still separates East
  Timor from Indonesian West Timor. Japan occupied the colony in 1942–1945. Portuguese rule ended
  with the decolonisation crisis of 1974–75 and the Indonesian invasion.
